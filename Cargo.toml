[package]
name = "sonar-rs"
version = "0.1.22"
edition = "2024"

[dependencies]
base64 = "0.23.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
